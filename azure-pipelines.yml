# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDir: '$(Build.SourcesDirectory)/env/dev'

steps:

# -----------------------------
# 1. Checkout GitHub repo
# -----------------------------
- checkout: self

# -----------------------------
# 2. Install Terraform
# -----------------------------
- task: TerraformInstaller@1
  displayName: "Install Terraform"
  inputs:
    terraformVersion: 'latest'

# -----------------------------
# 3. Terraform Init (DEV backend)
# -----------------------------
- task: TerraformTask@5
  displayName: "Terraform Init - DEV"
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'azure-connection'
    backendAzureRmResourceGroupName: 'NCPL'
    backendAzureRmStorageAccountName: 'dev1storagecanadacentral'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'dev.terraform.tfstate'
    workingDirectory: '$(terraformWorkingDir)'

# -----------------------------
# 4. Terraform Validate
# -----------------------------
- task: TerraformTask@5
  displayName: "Terraform Validate"
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(terraformWorkingDir)'

# -----------------------------
# 5. Terraform Plan (DEV)
# -----------------------------
- task: TerraformTask@5
  displayName: "Terraform Plan - DEV"
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'azure-connection'
    workingDirectory: '$(terraformWorkingDir)'

# -----------------------------
# 6. Terraform Apply (DEV)
# -----------------------------
- task: TerraformTask@5
  displayName: "Terraform Apply - DEV"
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'azure-connection'
    commandOptions: '-auto-approve'
    workingDirectory: '$(terraformWorkingDir)'